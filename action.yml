name: 'Install Stalwart Mail Server'
description: 'Starts a throwaway Stalwart server for development and testing and creates its domains and user accounts'
author: 'Nodarx'

branding:
  icon: 'mail'
  color: 'blue'

inputs:
  version:
    description: 'Stalwart server release'
    required: false
    default: 'v1.1.1'

  cli-version:
    description: 'stalwart-cli release used to create the domains and accounts'
    required: false
    default: 'v2.0.0'

  url:
    description: 'Base URL the server publishes in its JMAP session and discovery documents. The server listens for HTTP on port 8080.'
    required: false
    default: 'http://localhost:8080'

  hostname:
    description: 'Server hostname. Defaults to mail.<first domain>.'
    required: false
    default: ''

  admin-user:
    description: 'Administrator name'
    required: false
    default: 'admin'

  admin-password:
    description: 'Administrator password'
    required: false
    default: 'secretpassword'

  domains:
    description: 'JSON array of domains to create. Example: [{"name":"example.com","description":"Primary domain"}]. Domains of user addresses are created even when not listed.'
    required: false
    default: '[]'

  users:
    description: 'JSON array of users to create. Example: [{"email":"user@example.com","password":"violet-harbor-cactus-lantern","name":"User Name","quota":1073741824}]. Passwords must satisfy the default password policy.'
    required: false
    default: '[]'

  directory:
    description: 'Directory for the binaries, configuration, data store and log. Defaults to stalwart in the runner temporary directory.'
    required: false
    default: ''

outputs:
  url:
    description: 'Base URL the server publishes'
    value: ${{ inputs.url }}
  directory:
    description: 'Directory holding the binaries, configuration, data store and log'
    value: ${{ steps.start.outputs.directory }}
  cli:
    description: 'Path to stalwart-cli, for further changes with the administrator credentials'
    value: ${{ steps.start.outputs.directory }}/bin/stalwart-cli
  log:
    description: 'Path to the server log'
    value: ${{ steps.start.outputs.directory }}/server.log

runs:
  using: 'composite'
  steps:
    - name: Start Stalwart
      id: start
      shell: bash
      env:
        STALWART_VERSION: ${{ inputs.version }}
        STALWART_CLI_VERSION: ${{ inputs.cli-version }}
        STALWART_URL: ${{ inputs.url }}
        STALWART_HOSTNAME: ${{ inputs.hostname }}
        STALWART_ADMIN_USER: ${{ inputs.admin-user }}
        STALWART_ADMIN_PASSWORD: ${{ inputs.admin-password }}
        STALWART_DOMAINS: ${{ inputs.domains }}
        STALWART_USERS: ${{ inputs.users }}
        STALWART_DIR: ${{ inputs.directory || format('{0}/stalwart', runner.temp) }}
      run: |
        echo "::add-mask::$STALWART_ADMIN_PASSWORD"
        echo "$STALWART_USERS" | jq -r '.[]?.password // empty' 2> /dev/null | while read -r password; do
          echo "::add-mask::$password"
        done
        echo "directory=$STALWART_DIR" >> "$GITHUB_OUTPUT"
        "${{ github.action_path }}/scripts/start.sh"
