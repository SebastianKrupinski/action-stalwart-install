name: Test Stalwart Installation Action

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  basic:
    name: Without domains or users
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Start Stalwart
        id: stalwart
        uses: ./

      - name: Verify the server is ready
        run: curl -sSf http://localhost:8080/healthz/ready

      - name: Verify the administrator can sign in
        env:
          STALWART_URL: http://localhost:8080
          STALWART_USER: admin
          STALWART_PASSWORD: secretpassword
        run: '"${{ steps.stalwart.outputs.cli }}" query Domain --no-color'

      - name: Show log on failure
        if: failure()
        run: cat "${{ steps.stalwart.outputs.log }}" || true

  provisioned:
    name: With domains and users
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Start Stalwart
        id: stalwart
        uses: ./
        with:
          domains: '[{"name":"example.com","description":"Primary domain"}]'
          users: |
            [
              {"email":"user1@example.com","password":"violet-harbor-cactus-lantern","name":"User One","quota":1073741824},
              {"email":"user2@example.org","password":"amber-glacier-pocket-thunder"}
            ]

      - name: Verify users have a JMAP session with mail
        run: |
          set -euo pipefail
          for account in user1@example.com:violet-harbor-cactus-lantern user2@example.org:amber-glacier-pocket-thunder; do
            curl -sSf -u "$account" http://localhost:8080/jmap/session \
              | jq -e --arg user "${account%%:*}" '.username == $user and (.capabilities | has("urn:ietf:params:jmap:mail"))'
          done

      - name: Verify the domain of a user address was created
        env:
          STALWART_URL: http://localhost:8080
          STALWART_USER: admin
          STALWART_PASSWORD: secretpassword
        run: '"${{ steps.stalwart.outputs.cli }}" query Domain --no-color | grep -q example.org'

      - name: Verify running the action again succeeds
        uses: ./
        with:
          users: '[{"email":"user1@example.com","password":"violet-harbor-cactus-lantern"}]'

      - name: Show log on failure
        if: failure()
        run: cat "${{ steps.stalwart.outputs.log }}" || true

  invalid-input:
    name: Invalid input
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Start Stalwart with invalid users
        id: invalid
        continue-on-error: true
        uses: ./
        with:
          users: 'not json'

      - name: Verify the action failed
        if: steps.invalid.outcome != 'failure'
        run: |
          echo "::error::The action accepted invalid users JSON"
          exit 1

  summary:
    name: Test Summary
    runs-on: ubuntu-latest
    needs: [basic, provisioned, invalid-input]
    if: always()

    steps:
      - name: Check test results
        run: |
          {
            echo "## Test Results Summary"
            echo ""
            echo "- Without domains or users: ${{ needs.basic.result }}"
            echo "- With domains and users: ${{ needs.provisioned.result }}"
            echo "- Invalid input: ${{ needs.invalid-input.result }}"
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "${{ needs.basic.result }}" != "success" ] || \
             [ "${{ needs.provisioned.result }}" != "success" ] || \
             [ "${{ needs.invalid-input.result }}" != "success" ]; then
            echo "::error::One or more tests failed"
            exit 1
          fi

          echo "All tests passed"
